<div
  class="group relative rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition duration-500 cursor-pointer"
>
  <!-- Image -->
  <img
    [src]="image"
    class="w-full h-72 object-cover group-hover:scale-110 transition duration-700"
  />

  <!-- Overlay -->
  <div
    class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent opacity-80 group-hover:opacity-95 transition"
  ></div>

  <!-- Content -->
  <div class="absolute bottom-0 p-6 text-white">
    <div *ngIf="icon" class="mb-3 text-2xl text-indigo-400 group-hover:scale-125 transition">
      <i class="{{ icon }}"></i>
    </div>

    <h3 class="text-xl font-bold mb-2">
      {{ title }}
    </h3>

    <p class="text-gray-200 text-sm leading-relaxed">
      {{ text }}
    </p>
  </div>
</div>
