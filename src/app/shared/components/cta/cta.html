<section class="py-24 px-6">
  <div
    class="max-w-5xl mx-auto text-center bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-3xl p-12 shadow-2xl hover:scale-[1.02] transition duration-500"
  >
    <h3 class="text-3xl md:text-4xl font-bold mb-6">
      {{ title }}
    </h3>

    <p class="text-lg opacity-90 mb-10">
      {{ text }}
    </p>

    <a
      routerLink="/contact"
      class="inline-block bg-white text-indigo-700 px-8 py-4 rounded-2xl font-semibold hover:scale-105 transition shadow-lg"
    >
      {{ button }}
      <i class="fa-solid fa-arrow-right ml-2"></i>
    </a>
  </div>
</section>
