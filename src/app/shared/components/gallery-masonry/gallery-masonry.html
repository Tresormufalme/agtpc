<div class="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
  <div
    *ngFor="let img of images; let i = index"
    (click)="open(i)"
    class="relative group cursor-pointer overflow-hidden rounded-2xl bg-[#334344]/20 border border-[#4D676E]/30 hover:border-[#82A8B8]/50 transition-all duration-500 shadow-xl break-inside-avoid"
  >
    <img
      [src]="getImageSrc(img)"
      [alt]="img.alt || 'Action AGTPC'"
      class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-700"
    />

    <div
      class="absolute inset-0 bg-gradient-to-t from-[#202931] via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-6"
    >
      <p
        *ngIf="img.caption"
        class="text-white text-sm font-medium translate-y-4 group-hover:translate-y-0 transition-transform duration-500"
      >
        {{ img.caption }}
      </p>
    </div>
  </div>
</div>

<app-lightbox [images]="lightboxImages"></app-lightbox>
