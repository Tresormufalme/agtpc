<div class="relative text-center max-w-4xl mx-auto mb-20 group">
  <div
    class="mb-6 flex justify-center items-center space-x-3 opacity-0 translate-y-4 animate-in fade-in slide-in-from-bottom duration-1000 fill-mode-forwards"
  >
    <div class="h-px w-8 bg-[#82A8B8]/30"></div>
    <span class="text-[10px] uppercase tracking-[0.5em] font-black text-[#82A8B8]"
      >AGTPC Vision</span
    >
    <div class="h-px w-8 bg-[#82A8B8]/30"></div>
  </div>

  <h2
    class="text-4xl md:text-6xl font-black text-white tracking-tighter mb-6 relative inline-block"
  >
    <span
      class="relative z-10 bg-clip-text text-transparent bg-gradient-to-b from-white via-white to-[#82A8B8]/50"
    >
      {{ title }}
    </span>

    <div
      class="absolute -inset-x-10 top-1/2 -translate-y-1/2 h-20 bg-[#82A8B8]/5 blur-[60px] rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-[2s]"
    ></div>
  </h2>

  <p
    *ngIf="subtitle"
    class="text-slate-400 text-sm md:text-lg leading-relaxed max-w-2xl mx-auto font-medium tracking-wide"
  >
    {{ subtitle }}
  </p>

  <div class="mt-10 flex justify-center items-center relative">
    <div class="h-[1px] w-48 bg-[#4D676E]/20 rounded-full relative overflow-hidden">
      <div
        class="absolute inset-0 w-1/2 bg-gradient-to-r from-transparent via-[#82A8B8] to-transparent animate-shimmer"
      ></div>
    </div>

    <div
      class="absolute w-1.5 h-1.5 bg-[#82A8B8] rounded-full shadow-[0_0_12px_#82A8B8] animate-pulse"
    ></div>
  </div>
</div>
